name: RubyGems Publish

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for RubyGems trusted publishing

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build gem
        run: |
          gem build *.gemspec
          mkdir -p pkg
          mv *.gem pkg/

      - name: Publish to RubyGems
        run: |
          gem push --key github pkg/*.gem
        env:
          RUBYGEMS_HOST: https://rubygems.org
          # No API key needed - uses OIDC token from id-token permission
